name: build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Splitbill.sln

      - name: Build
        run: dotnet build Splitbill.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Tests\Splitbill.Tests.csproj --configuration Release --no-build --no-restore
